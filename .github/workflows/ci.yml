name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
